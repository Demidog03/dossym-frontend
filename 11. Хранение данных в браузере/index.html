<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кофейня — корзина</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <p class="logo">кофейня</p>
        <!-- JS будет писать сюда количество товаров -->
        <p class="badge">в корзине: <span id="cart-count">0</span></p>
    </header>

    <main class="layout">

        <!-- ================= КАТАЛОГ =================
       Данные о товаре лежат в data-атрибутах кнопки.
       В JS их можно прочитать так:
         button.dataset.id
         button.dataset.title
         button.dataset.price
  ============================================== -->
        <section>
            <h2 class="section-title">Меню</h2>
            <ul class="catalog">

                <li class="product">
                    <span class="product-name">Эспрессо</span>
                    <span class="product-price">900 KZT</span>
                    <button class="add" data-id="1" data-title="Эспрессо" data-price="900">+</button>
                </li>

                <li class="product">
                    <span class="product-name">Капучино</span>
                    <span class="product-price">1800 KZT</span>
                    <button class="add" data-id="2" data-title="Капучино" data-price="1800">+</button>
                </li>

                <li class="product">
                    <span class="product-name">Круассан</span>
                    <span class="product-price">1200 KZT</span>
                    <button class="add" data-id="3" data-title="Круассан" data-price="1200">+</button>
                </li>

                <li class="product">
                    <span class="product-name">Чизкейк</span>
                    <span class="product-price">2500 KZT</span>
                    <button class="add" data-id="4" data-title="Чизкейк" data-price="2500">+</button>
                </li>

            </ul>
        </section>

        <!-- ================= КОРЗИНА =================
       Всё, что ниже, JS будет заполнять сам:
         #cart-list   — сюда добавляем <li> с товарами
         #cart-empty  — показываем, когда корзина пуста
         #cart-total  — итоговая сумма
  ============================================== -->
        <section class="cart">
            <h2 class="section-title">Корзина</h2>

            <ul class="cart-list" id="cart-list">
                <!-- <li class="cart-item">
                    <span class="name">Эспрессо</span>
                    <span class="qty">2</span>
                    <span class="sum">1800 KZT</span>
                </li> -->
            </ul>

            <p class="cart-empty" id="cart-empty">Пока пусто</p>

            <div class="cart-footer">
                <p class="cart-total">Итого: <strong id="cart-total">0</strong> KZT</p>
                <button class="clear" id="cart-clear">Очистить</button>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
